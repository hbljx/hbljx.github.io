<article class="page" data-station="mailbox">
  <h2>Li+ 家园游玩指南</h2>
  <div class="li-help">
    <p class="guide-intro">把好用的网址，留在这个小世界里。进屋体验日常活动，出门坐车、出海或飞上天空。</p>
    <h3>快速上手</h3>
    <p>用 WASD 或方向键移动，也可以点击地面走过去。拖动调整视角，Shift 跑步，空格跳跃，R 切换走路、跑步和飞行。靠近物件按 E 开始互动，多数活动可再按 E 或 Esc 结束。靠近椅凳、沙发或床沿按 Q 坐下或起身。手机可点击地面移动，并用屏幕上的按钮操作。</p>
    <p>走近一楼门口的绿色指南书按 E，或直接点击书本，即可重读本指南。底部快捷栏可打开网址目录。右上角的蛛丝按钮点一下开启，再点击可到达的位置即可摆荡，再点按钮关闭。声音开关也在右上角。</p>

    <h3>一、屋内与屋顶互动</h3>
    <h4>1. 客厅 · 沙发上看电视</h4>
    <p>靠近电视前的沙发按 E 坐下。按空格在海岸旅行台和像素体育台之间换台，按 P 暂停或继续播放。</p>
    <h4>2. 健身房 · 跑步与器械训练</h4>
    <p>走到跑步机前按 E 开跑，空格暂停或继续，R 切换速度。也可走近动感单车、引体向上架、卧推凳、哑铃、拉力器或摸高架，按 E 开始对应动作，再按 E 结束。</p>
    <h4>3. 家庭影院 · 双人观影</h4>
    <p>走到影院沙发旁按 E，女主会过来一起坐下看动画电影。拖动可以调整观影视角，按 E 结束。</p>
    <h4>4. 厨房 · 切菜、翻炒、出锅</h4>
    <p>靠近料理台按 E 开始做饭。按空格切菜三次，再按空格翻炒三次，等菜出锅。出锅后按空格可以再做一份。</p>
    <h4>5. 图书角 · 一起翻书</h4>
    <p>在一楼后侧的双人图书馆按 E，邀请女主一起读书。二楼灵感书房也能单独阅读。用左右方向键翻页，空格翻到下一页。</p>
    <h4>6. 车库 · 选车上车</h4>
    <p>走近特斯拉 Model Y、白色劳斯莱斯敞篷跑车或摩托车，按 E 进入驾驶。等女主上车后再出发，驾驶和喷气飞行操作见下方室外篇。</p>
    <h4>7. 浴室 · 双人沐浴</h4>
    <p>走近浴室互动点按 E 开始睡前流程。两人到齐后开始五分钟沐浴倒计时，结束后一起上楼休息。途中可按 E 取消。</p>
    <h4>8. 音乐咖啡吧 · 坐下喝咖啡</h4>
    <p>靠近吧台座位按 E，角色会坐下喝第一口。等动作结束后，按空格再喝一口，面板会记录喝了几口。</p>
    <h4>9. 屋顶停机坪 · 驾驶三楼飞机</h4>
    <p>上到三楼停机坪，走近飞机按 E 登机，按 1 或点「起飞」垂直升空。空中用 W / S 调速、A / D 转向、空格上升、C 下降、V 悬停或继续。按 R 返回三楼，停稳后按 E 下机。</p>
    <h4>10. 卧室 · 挂机休息与唤醒</h4>
    <p>角色原地静止五分钟后会触发睡前流程，也可在卧室床边按 E 主动开始。两人先去浴室，再一起上床休息。游戏的睡眠时段为北京时间 22:00–07:00，正在驾驶或互动时会延后休息。点击地面可唤醒玩家角色。</p>
    <h4>11. AI 工作台 · 接金块小游戏</h4>
    <p>到电脑前按 E 开始，用 A / D 或左右方向键接金块、避开红块，按空格重新开始。</p>
    <h4>12. 三楼茶室 · 泡茶观景</h4>
    <p>走近茶桌按 E 坐下，按空格泡一杯茶，拖动视角看看屋顶外的风景。</p>

    <h3>二、室外互动与探索</h3>
    <h4>1. 驾车出游 · 三种载具</h4>
    <p>用 W / S 前进和倒车，A / D 转向，空格刹车，E 下车，R 回车库。可沿东侧海岸路开上海上观景桥，到山脚平台停车，再步行上后山。驾驶 Model Y 时还可按 J 启动喷气，空格 / C 升降，V 悬停，再按 J 或 L 降落。</p>
    <h4>2. 公交 · 沿海桥去山脚</h4>
    <p>公交经过家园站、海桥观景站和山脚站。到对应方向的站台按 E，和女主一起等车，公交进站开门后会自动上车。停稳后按 E 下车，行驶中按 E 可预约下一站下车。</p>
    <h4>3. 海上地铁 · 家园与山脚往返</h4>
    <p>到家园站或山脚站的站台按 E 候车，开门后自动上车。沿途可拖动视角看海景，到站停稳后按 E 下车，行驶中按 E 可预约到站下车。</p>
    <h4>4. 海底隧道 · 步行看海</h4>
    <p>从车库出口向前直走，从正对面的入口进入海底隧道。沿隧道步行到山脚，拖动视角透过玻璃看海。如果开车进入隧道，可按 T 开启隧道领航，操作方向键即可接管。</p>
    <h4>5. 海边栈道 · 看浮漂钓鱼</h4>
    <p>到海边栈道尽头的钓鱼台按 E，按空格抛竿。等浮漂下沉，在 2.5 秒内再按空格收线，提早拉竿会错过上钩时机。</p>
    <h4>6. 001 号航母 · 驾舰与甲板起飞</h4>
    <p>沿海岸栈桥登舰，从舰岛侧门进驾驶舱，在操纵台旁按 E 掌舵。用 W / S 前后航行、A / D 转向、Shift 加速、空格刹车。P 开始或暂停自动巡航，R 自动返港，方向键或空格可接管。</p>
    <p>在飞行甲板上走近战斗机或预警机按 E 登机，按 1 垂直起飞、2 弹射起飞或 3 滑跃起飞。飞行操作与屋顶飞机相同，按 H 降落航母，按 L 降落后山停机坪，停稳后按 E 下机。</p>
    <h4>7. 领海一号 · 驾驶潜艇巡视</h4>
    <p>走到潜艇登艇点按 E。用 W / S 前后航行、A / D 转向、C 下潜、空格上浮。按 P 开始或暂停自动巡视，可对照声呐航图寻找荧光珊瑚林、深海热泉和领地界碑。按 R 上浮返港，按 E 返港下艇。</p>
    <h4>8. 人物飞行 · 从空中俯瞰岛屿</h4>
    <p>到屋外空地按 R 切到飞行模式，手机可点右上角的移动模式按钮。空格升高，Ctrl 降低，Shift 加速，手机可用屏幕上的升降按钮。从海岸上方回望家园，也可以沿桥飞到后山看全景。再切回走路即可落地。</p>
    <h4>9. 天气与时段 · 同一地点看不同风景</h4>
    <p>点右上角「天气与时段」，可选择清晨、上午、白天、黄昏或夜晚，也可切换晴天、薄雾、下雪、雷雨等天气。试试在海桥看黄昏，或给家园换上雪景。点「恢复实时」可回到实时天气和时段。</p>
    <h4>10. 篮球场 · 蓄力投篮</h4>
    <p>走进球场按 E，按住空格或投篮按钮蓄力，等指针进绿色区再松手。面板会记录得分和出手次数。</p>
  </div>

    ? '<h2>请用本地服务器打开</h2><p>直接双击打开时，浏览器不会加载 3D 世界。在这个文件夹里运行 <code>python3 tools/serve.py</code>（Windows 用 <code>python tools/serve.py</code>），它会找一个空闲端口并自动打开页面。地址也会打印在终端里。</p>'
    : '<h2>Open it through a local server</h2><p>Browsers don’t load the 3D world from a double-clicked file. In this folder, run <code>python3 tools/serve.py</code> (on Windows, <code>python tools/serve.py</code>). It picks a free port and opens the page. The address is also printed in the terminal.</p>';
  document.getElementById('pages').before(note);
  document.getElementById('loading')?.remove();
  document.body.classList.add('plain');
  const css = document.createElement('link');
  css.rel = 'stylesheet'; css.href = 'engine/style.css'; document.head.append(css);
}
</script>
<script type="module" src="navigation/home.js"></script>
</body>
