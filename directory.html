<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17392e"><title>导航手册 · Li+ 像素导航</title><link rel="icon" href="assets/li.png"><link rel="stylesheet" href="navigation/directory.css?v=20261031-nav-steering"><script type="module" src="navigation/directory.js?v=20261031-nav-steering"></script></head>
<body>
<main>
  <section class="search-panel" aria-label="搜索网址"><form id="search-form" role="search"><label class="sr-only" for="query">输入搜索关键词</label><span class="search-glyph" aria-hidden="true">⌕</span><input id="query" type="search" placeholder="百度一下 你就知道" autocomplete="off"><label class="sr-only" for="search-mode">搜索范围</label><select id="search-mode"><option value="search_1" selected>百度</option><option value="local">本站网址</option></select><button type="submit" class="primary">搜索</button></form><div class="search-meta"><span id="search-tip">Enter 在新标签页搜索</span><button id="clear-search" type="button" hidden>清空搜索 ×</button></div></section>
  <section class="directory-nav" aria-label="我的目录"><div class="side-caption">我的目录 <span id="total-count">…</span></div><nav id="group-nav" aria-label="网址分类"></nav><div class="directory-actions"><button id="favorites-filter" type="button" aria-pressed="false">☆ 星标收藏</button><button id="recent-filter" type="button" aria-pressed="false">◷ 最近打开</button><a class="legacy-link" href="directory.html" target="_blank" rel="noopener">独立目录 ↗</a></div></section>
  <div class="workspace"><aside class="sidebar"><div class="side-caption">场景导航</div><nav id="zone-nav" aria-label="房间分类"></nav></aside><section class="results"><div class="results-heading"><div><span class="eyebrow" id="result-eyebrow">COLLECTION</span><h2 id="result-title">全部网址</h2></div><span id="result-count" aria-live="polite"></span></div><div class="quick-links" id="quick-links"></div><div id="cards" aria-live="polite"></div><div id="empty" hidden><span>◇</span><h3>这里暂时没有网址</h3><p id="empty-hint">换个关键词，或切换到全部网址试试。</p><button id="show-all" type="button">查看全部网址</button></div></section></div>
  <footer><span>LI+ <b>把好用的，留在手边。</b></span><div><button id="add-site" type="button">＋ 添加网址</button><button id="export" type="button">导出备份</button><button id="import" type="button">导入备份</button><button id="undo" type="button" hidden>撤销</button></div><small>网址修改与星标保存在当前浏览器。换设备或端口前可导出备份。</small></footer>
</main>
<p id="toast" role="status" hidden></p><input id="import-file" type="file" accept=".json,application/json" hidden>
<dialog id="editor" aria-labelledby="editor-title"><form id="editor-form"><div class="dialog-heading"><h2 id="editor-title">添加网址</h2><button type="button" data-close="editor" aria-label="关闭编辑">×</button></div><label>网站名称<input name="name" required maxlength="200"></label><label>网址<input name="url" type="url" required placeholder="https://" maxlength="4096"></label><label>分类<select name="groupId"></select></label><label>分类内分区（可选）<input name="section" maxlength="120" placeholder="例如：免费1K"></label><label>简介（可选）<textarea name="description" maxlength="1000" rows="2"></textarea></label><fieldset><legend>收藏范围</legend><label><input name="original" type="checkbox" checked> 常用网站</label><label><input name="bookmarks" type="checkbox"> 我的书签</label></fieldset><p id="editor-error" role="alert"></p><div class="dialog-actions"><button type="button" id="delete-site" class="danger" hidden>删除网址</button><button type="button" data-close="editor">取消</button><button type="submit" class="primary">保存</button></div></form></dialog>
<dialog id="confirm" aria-labelledby="confirm-title"><form method="dialog"><h2 id="confirm-title">确认删除这个网址？</h2><p id="confirm-text"></p><div class="dialog-actions"><button value="cancel" autofocus>取消</button><button value="delete" class="danger">删除</button></div></form></dialog>
<dialog id="preview" aria-labelledby="preview-title"><div class="dialog-heading"><h2 id="preview-title">网页预览</h2><a id="preview-open" target="_blank" rel="noopener noreferrer">新标签页打开 ↗</a><button type="button" data-close="preview" aria-label="关闭预览">×</button></div><p>若网页未显示，或需要登录，请在新标签页打开。</p><div id="preview-frame"></div></dialog>
<noscript><p>请启用 JavaScript 后刷新页面，以加载网址目录。</p></noscript>
</body></html>
